name: CI

on:
  push:
    branches:
      - main
      - test
      - development
  pull_request:
    branches:
      - main
      - test

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      # --------------------
      # Checkout Repo
      # --------------------
      - name: Checkout Repo
        uses: actions/checkout@v4

      # --------------------
      # Setup .NET
      # --------------------
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # --------------------
      # GitHub Packages Auth
      # --------------------
      - name: Reset GitHub Packages source
        run: |
          dotnet nuget remove source github || echo "source not exists"
          dotnet nuget add source \
            --username mansur61 \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/mansur61/index.json"


      # --------------------
      # Restore / Build / Test
      # --------------------
      - run: dotnet restore HerkesYazarOlsun/HerkesYazarOlsun.Service.csproj
      - run: dotnet build HerkesYazarOlsun/HerkesYazarOlsun.Service.csproj -c Release --no-restore
      - name: Run Tests (only for test/main)
        if: github.ref_name == 'test' || github.ref_name == 'main'
        run: dotnet test HerkesYazarOlsun/HerkesYazarOlsun.Service.csproj -c Release --no-build

      # --------------------
      # Publish (Sadece test ve main)
      # --------------------
      - name: Publish
        if: github.ref_name == 'test' || github.ref_name == 'main'
        run: dotnet publish HerkesYazarOlsun/HerkesYazarOlsun.Service.csproj -c Release -o publish

      # --------------------
      # TEST DEPLOY
      # -------------------

      - name: Deploy TEST
        if: github.ref_name == 'test'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: publish/
          server-dir: /api.herkesyazarolsun.com.tr/test/

      # --------------------
      # PROD DEPLOY
      # -------------------

      - name: Deploy PROD
        if: github.ref_name == 'main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: publish/
          server-dir: /api.herkesyazarolsun.com.tr/prod/
