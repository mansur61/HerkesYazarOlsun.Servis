name: Publish Model Package

on:
  push:
    branches:
      - development

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        run: dotnet pack HerkesYazarOlsun.Model/HerkesYazarOlsun.Model.csproj -c Release -o ./nupkg
      
      - name: Publish to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg \
              --source "https://nuget.pkg.github.com/mansur61/index.json" \
              --api-key ${{ secrets.GITHUB_TOKEN }}

